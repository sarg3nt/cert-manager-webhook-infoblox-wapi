name: Release Chart

# Publishes the Helm chart to the gh-pages branch using the canonical
# chart-releaser pattern: run on every push to main that changes charts/**.
# chart-releaser diffs each chart's version against existing GitHub releases and
# only publishes versions that don't yet have a release, so this is naturally
# idempotent. This replaces the previous `pull_request: closed` trigger, which
# fired on ANY PR close -- merged or not -- and published charts from unmerged
# branches (it once shipped a broken 3.0.1 chart from a closed release PR).
on:
  push:
    branches: ["main"]
    paths:
      - "charts/**"
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Don't cancel chart deployments

jobs:
  release-chart:
    name: Release Chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        disable-sudo: true
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      env:
        GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

    # This will release the chart to the gh-pages branch. `skip_existing` makes
    # re-runs safe: if a chart's release/tag already exists it is skipped instead
    # of failing the job.
    - name: Run Chart-Releaser
      uses: helm/chart-releaser-action@df287104677278f869ca5480bd260358397cc3f9 # v1.8.0
      with: 
        mark_as_latest: false
        skip_existing: true
      env:
        CR_TOKEN: "${{ secrets.USER_PAT }}"
