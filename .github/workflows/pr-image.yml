name: PR Image

# Publishes a multi-arch test image for each pull request so changes can be
# tried on a real (remote) cluster before merge, and deletes those images once
# the pull request is merged or closed.
#
# Images go to a separate package (`<repo>-pr`) rather than the release package,
# so the throwaway tags never clutter what users pull. Each PR gets two tags:
#   pr-<N>          moves to the latest push on the PR
#   pr-<N>-<sha7>   immutable, one per pushed head commit
#
# Pull requests from forks and from Dependabot receive a read-only GITHUB_TOKEN
# and cannot push packages, so they are skipped. To get an image for a
# Dependabot PR, run this workflow manually on its branch with the PR number.
# See docs/testing-pr-images.md.

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: "Number of the open PR whose head branch this run is building (select that branch above)"
        required: true
        type: number

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}-pr
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}

# One run per PR. Closing the PR cancels any in-flight build before cleanup.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Push PR Image
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      # A manual run must target the branch of an open PR, otherwise the image
      # would be tagged pr-<N> for code that isn't that PR and would never be
      # cleaned up.
      - name: Verify Branch Matches PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          info=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,headRefName --jq '"\(.state) \(.headRefName)"')
          read -r state head <<<"$info"
          if [ "$state" != "OPEN" ]; then
            echo "::error::PR #$PR_NUMBER is $state, not OPEN"
            exit 1
          fi
          if [ "$head" != "$GITHUB_REF_NAME" ]; then
            echo "::error::PR #$PR_NUMBER head branch is '$head' but this run is on '$GITHUB_REF_NAME'"
            exit 1
          fi

      # Build the PR head commit (what was pushed), not the synthetic merge commit.
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Log Into Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=pr-${{ env.PR_NUMBER }}
            type=sha,prefix=pr-${{ env.PR_NUMBER }}-,format=short

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep a single comment per PR up to date instead of adding one per push.
      - name: Comment Image Reference on PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          marker='<!-- pr-image -->'
          sha_tag="pr-${PR_NUMBER}-${HEAD_SHA::7}"
          body=$(cat <<EOF
          ${marker}
          ### PR test image

          Built from \`${HEAD_SHA::7}\` for \`linux/amd64\` and \`linux/arm64\`.

          | Tag | Reference |
          | --- | --- |
          | Immutable | \`${IMAGE}:${sha_tag}\` |
          | Latest on this PR | \`${IMAGE}:pr-${PR_NUMBER}\` |
          | Digest | \`${IMAGE}@${DIGEST}\` |

          Deploy to a cluster with the published chart:

          \`\`\`bash
          helm upgrade --install webhook-infoblox-wapi \\
            cert-manager-webhook-infoblox-wapi/cert-manager-webhook-infoblox-wapi \\
            -n cert-manager --reuse-values \\
            --set image.repository=${IMAGE} \\
            --set image.tag=${sha_tag}
          \`\`\`

          If this PR changes the chart, install from \`charts/cert-manager-webhook-infoblox-wapi\` in a checkout of the PR branch instead. These images are deleted when the PR is merged or closed. See [docs/testing-pr-images.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/testing-pr-images.md).
          EOF
          )

          comment_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-image -->"))) | .id' | head -n1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi

          {
            echo "## PR test image"
            echo ""
            echo "- \`${IMAGE}:${sha_tag}\`"
            echo "- \`${IMAGE}:pr-${PR_NUMBER}\`"
            echo "- \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Delete PR Images
    # Runs when the PR is merged or closed without merging. Fork PRs never get
    # images, and a Dependabot-triggered close has a read-only token.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      # Not every PR has images (e.g. Dependabot PRs that were never built
      # manually). Skip cleanup cleanly in that case; fail on any other error.
      - name: Check for PR Images
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}-pr
        run: |
          if ! tags=$(gh api --paginate "/users/${OWNER}/packages/container/${PACKAGE}/versions" \
              --jq '.[].metadata.container.tags[]' 2>err.txt); then
            if grep -q "HTTP 404" err.txt; then
              echo "Package ${PACKAGE} not found; nothing to clean up."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat err.txt
            exit 1
          fi
          if grep -qxE "pr-${PR_NUMBER}(-[0-9a-f]{7})?" <<<"$tags"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No images tagged for PR #${PR_NUMBER}; nothing to clean up."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Deleting a multi-arch tag also removes its per-platform and attestation
      # manifests. Untagged sweeping is deliberately off: another PR's build may
      # be mid-push, with its platform manifests not yet referenced by a tag.
      - name: Delete PR Image Tags
        if: steps.check.outputs.found == 'true'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ github.token }}
          package: ${{ github.event.repository.name }}-pr
          delete-tags: pr-${{ env.PR_NUMBER }},pr-${{ env.PR_NUMBER }}-*
          delete-untagged: false
